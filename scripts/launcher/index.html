<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- PocketMZ game menu -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PocketMZ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div id="brand">PocketMZ</div>
    <div id="tabbar">
      <span class="hintkey" id="hintL">L1</span>
      <div id="tabs"></div>
      <span class="hintkey" id="hintR">R1</span>
    </div>
  </header>
  <main id="grid"></main>
  <div id="empty" hidden></div>
  <footer id="info">
    <div id="ititle"></div>
    <div id="ibadges"></div>
    <div id="iwarn"></div>
    <div id="ihints"></div>
  </footer>
</div>
<div id="overlay" hidden></div>
<script src="menu.js"></script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="pocketmz" features="smooth, autosave">
    <cores>
      <core name="pocketmz" features="smooth, autosave">
        <features>
          <feature name="渲染分辨率" value="render_scale">
            <choice name="按屏幕 (640x480)" value="screen"/>
            <choice name="游戏原始分辨率" value="off"/>
          </feature>
          <feature name="画面帧率" value="fps_limit">
            <choice name="30 fps" value="30"/>
            <choice name="60 fps" value="60"/>
          </feature>
          <feature name="显示帧数" value="show_fps">
            <choice name="开" value="1"/>
            <choice name="关" value="0"/>
          </feature>
          <feature name="运行时内核" value="runtime">
            <choice name="自动优选" value="autopick"/>
            <choice name="β (轻量高速)" value="beta"/>
            <choice name="NW.js (α 兼容)" value="nw"/>
          </feature>
          <feature name="运行时关闭 ES (省内存)" value="stop_es">
            <choice name="开" value="1"/>
            <choice name="关" value="0"/>
          </feature>
        </features>
      </core>
    </cores>
  </emulator>
</features>

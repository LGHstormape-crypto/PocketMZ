<?xml version="1.0"?>
<!-- PocketMZ: runs RPG Maker MV/MZ games (NW.js arm64 runtime in /storage/pocketmz).
     Installed as /storage/.config/emulationstation/es_systems_pocketmz.cfg (ES reads every
     es_systems_*.cfg next to its es_systems.cfg) or merged into the image's es_systems.cfg.
     Entries are launcher files made by pocketmz-scan.sh (Tools > Scan PocketMZ Games); the games
     themselves live in /storage/roms/rpgmaker. MIT license. -->
<systemList>
	<system>
		<name>rpgmz</name>
		<fullname>RPGMZ</fullname>
		<manufacturer>Various</manufacturer>
		<release>2015</release>
		<hardware>game engine</hardware>
		<path>/storage/roms/rpgmz</path>
		<extension>.rpgmz</extension>
		<command>/storage/pocketmz/pocketmz-run.sh %ROM%</command>
		<platform>pc</platform>
		<theme>easyrpg</theme>
		<emulators>
			<emulator name="pocketmz">
				<cores>
					<core default="true">pocketmz</core>
				</cores>
			</emulator>
		</emulators>
	</system>
</systemList>
